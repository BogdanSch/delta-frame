components:
  schemas:
    CameraAngleResponseDTO:
      type: object
      properties:
        id:
          type: integer
        tool_id:
          type: string
          format: uuid
        name:
          type: string
        target_distance_cm:
          type: number
          format: double
        target_lux:
          type: integer
        tolerance_margin_cm:
          type: number
          format: double
      required:
      - id
      - name
      - target_distance_cm
      - target_lux
      - tolerance_margin_cm
      - tool_id
    CompleteSessionRequestDTORequest:
      type: object
      properties:
        conclusion:
          $ref: '#/components/schemas/ConclusionEnum'
      required:
      - conclusion
    ConclusionEnum:
      enum:
      - CLEAN
      - MINOR_WEAR
      - DAMAGED
      - UNVERIFIED
      type: string
      description: |-
        * `CLEAN` - CLEAN
        * `MINOR_WEAR` - MINOR_WEAR
        * `DAMAGED` - DAMAGED
        * `UNVERIFIED` - UNVERIFIED
    CreateCameraAngleRequestDTORequest:
      type: object
      properties:
        tool_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        target_distance_cm:
          type: number
          format: double
          minimum: 0.0
        target_lux:
          type: integer
          minimum: 0
        tolerance_margin_cm:
          type: number
          format: double
          minimum: 0.0
          default: 2.5
      required:
      - name
      - target_distance_cm
      - target_lux
      - tool_id
    CreateSessionRequestDTORequest:
      type: object
      properties:
        tool_id:
          type: string
          format: uuid
        worker_id:
          type: integer
          nullable: true
        session_type:
          $ref: '#/components/schemas/SessionTypeEnum'
      required:
      - session_type
      - tool_id
    CreateToolRequestDTORequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ''
      required:
      - name
    CreateUserRequestDTORequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 4
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: WORKER
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
      required:
      - password
      - username
    DefectAnalysisResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        angle_id:
          type: integer
        before_photo_id:
          type: string
          format: uuid
        before_image_url:
          type: string
          readOnly: true
        after_photo_id:
          type: string
          format: uuid
        after_image_url:
          type: string
          readOnly: true
        difference_index:
          type: number
          format: double
        description:
          type: string
        bounding_boxes:
          type: array
          items:
            type: object
            additionalProperties: {}
        is_approved_by_human:
          type: boolean
      required:
      - after_image_url
      - after_photo_id
      - angle_id
      - before_image_url
      - before_photo_id
      - bounding_boxes
      - description
      - difference_index
      - id
      - is_approved_by_human
      - session_id
    PatchedApproveDefectRequestDTORequest:
      type: object
      properties:
        description:
          type: string
        bounding_boxes:
          type: array
          items:
            type: object
            additionalProperties: {}
    PatchedUpdateCameraAngleRequestDTORequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        target_distance_cm:
          type: number
          format: double
          minimum: 0.0
        target_lux:
          type: integer
          minimum: 0
        tolerance_margin_cm:
          type: number
          format: double
          minimum: 0.0
    PatchedUpdateDefectRequestDTORequest:
      type: object
      properties:
        difference_index:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
        description:
          type: string
        bounding_boxes:
          type: array
          items:
            type: object
            additionalProperties: {}
    PatchedUpdateSessionRequestDTORequest:
      type: object
      properties:
        worker_id:
          type: integer
          nullable: true
        conclusion:
          $ref: '#/components/schemas/ConclusionEnum'
    PatchedUpdateToolRequestDTORequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedUpdateUserRequestDTORequest:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
          minLength: 4
    PhotoResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        angle_id:
          type: integer
        angle_name:
          type: string
        image_url:
          type: string
          readOnly: true
        source_device:
          type: string
        measured_distance_cm:
          type: number
          format: double
        measured_lux:
          type: integer
        is_geometry_valid:
          type: boolean
        timestamp:
          type: string
          format: date-time
      required:
      - angle_id
      - angle_name
      - id
      - image_url
      - is_geometry_valid
      - measured_distance_cm
      - measured_lux
      - session_id
      - source_device
      - timestamp
    ProblemDetailDTO:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties: {}
      required:
      - code
      - detail
      - status
      - title
    RoleEnum:
      enum:
      - ADMIN
      - INSPECTOR
      - WORKER
      type: string
      description: |-
        * `ADMIN` - ADMIN
        * `INSPECTOR` - INSPECTOR
        * `WORKER` - WORKER
    SessionDetailResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        tool_name:
          type: string
        inspector_id:
          type: integer
        worker_id:
          type: integer
          nullable: true
        session_type:
          type: string
        status:
          type: string
        conclusion:
          type: string
        created_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoResponseDTO'
        defect_analyses:
          type: array
          items:
            $ref: '#/components/schemas/DefectAnalysisResponseDTO'
      required:
      - conclusion
      - created_at
      - defect_analyses
      - id
      - inspector_id
      - photos
      - session_type
      - status
      - tool_id
      - tool_name
      - worker_id
    SessionSummaryResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        tool_name:
          type: string
        inspector_id:
          type: integer
        worker_id:
          type: integer
          nullable: true
        session_type:
          type: string
        status:
          type: string
        conclusion:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - conclusion
      - created_at
      - id
      - inspector_id
      - session_type
      - status
      - tool_id
      - tool_name
      - worker_id
    SessionTypeEnum:
      enum:
      - ISSUANCE
      - RETURN
      type: string
      description: |-
        * `ISSUANCE` - ISSUANCE
        * `RETURN` - RETURN
    SourceDeviceEnum:
      enum:
      - IOT
      - MOBILE
      type: string
      description: |-
        * `IOT` - IOT
        * `MOBILE` - MOBILE
    StatusEnum:
      enum:
      - AVAILABLE
      - IN_USE
      - MAINTENANCE
      type: string
      description: |-
        * `AVAILABLE` - AVAILABLE
        * `IN_USE` - IN_USE
        * `MAINTENANCE` - MAINTENANCE
    SyncSessionRequestDTORequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tool_id:
          type: string
          format: uuid
        worker_id:
          type: integer
          nullable: true
        session_type:
          $ref: '#/components/schemas/SessionTypeEnum'
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - session_type
      - tool_id
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    ToolDetailResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        qr_code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        camera_angles:
          type: array
          items:
            $ref: '#/components/schemas/CameraAngleResponseDTO'
      required:
      - camera_angles
      - created_at
      - description
      - id
      - name
      - qr_code
      - status
    UploadPhotoRequestDTORequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        angle_id:
          type: integer
        image_file:
          type: string
          format: binary
        source_device:
          $ref: '#/components/schemas/SourceDeviceEnum'
        measured_distance_cm:
          type: number
          format: double
          minimum: 0.0
        measured_lux:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
      required:
      - angle_id
      - image_file
      - measured_distance_cm
      - measured_lux
      - session_id
      - source_device
    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
      required:
      - email
      - first_name
      - id
      - is_active
      - last_name
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
